name: tmx

services:
  tmx:
    build:
      context: .
      args:
        VITE_SCORE_RELAY_URL: "${VITE_SCORE_RELAY_URL:-disabled}"
    image: tmx:local
    restart: unless-stopped
    ports:
      - "${TMX_PORT:-8080}:80"
    depends_on:
      cfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/tmx/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  cfs:
    build:
      context: .
      dockerfile: docker/cfs.Dockerfile
      args:
        CFS_REF: "${CFS_REF:-525571e5f8110376d6c8534c37cc3d975a2f0f15}"
    image: tmx-cfs:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_MODE: production
      APP_NAME: Competition Factory Server
      APP_PORT: "8383"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8080}"
      TMX_URL: /tmx/
      SERVER_PROFILE: full
      STORAGE_PROVIDER: postgres
      JWT_SECRET: "${JWT_SECRET:-local-development-secret-change-before-deployment}"
      JWT_VALIDITY: "${JWT_VALIDITY:-2h}"
      CFS_CORS_ORIGINS: "${CFS_CORS_ORIGINS:-*}"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: "${PG_USER:-courthive}"
      PG_PASSWORD: "${PG_PASSWORD:-courthive}"
      PG_DATABASE: "${PG_DATABASE:-courthive}"
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # The local stack does not run courthive-rankings. Proxy its public,
      # read-only provider directory to the hosted service instead of the CFS
      # default (localhost:3110, which is only valid for a co-resident deploy).
      RANKINGS_BASE_URL: "${RANKINGS_BASE_URL:-https://courthive.net/api}"
      PERSONS_DISABLED: "true"
      DECLARATIONS_DISABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8383/api/config').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - cfs-archives:/app/.archives-local

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${PG_USER:-courthive}"
      POSTGRES_PASSWORD: "${PG_PASSWORD:-courthive}"
      POSTGRES_DB: "${PG_DATABASE:-courthive}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-courthive} -d ${PG_DATABASE:-courthive}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  cfs-archives:
