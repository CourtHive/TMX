server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /tmx/;
    }

    location = /tmx {
        return 301 /tmx/;
    }

    location /tmx/ {
        try_files $uri $uri/ /tmx/index.html;
    }

    # Resolve the Compose service name at request time. This lets the frontend
    # image still start by itself; API calls return 502 until CFS is available.
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cfs_upstream http://cfs:${APP_PORT};

        proxy_pass $cfs_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
