packages:
  - .

# Keep pnpm v11's supply-chain minimumReleaseAge policy active for
# third-party packages (1440 minutes = 1 day floor), but exempt every
# CourtHive package we publish ourselves so cross-repo release cascades
# don't get blocked by their own freshness. CourtHive packages are also
# `link:../` overridden below — the lockfile entries are advisory, not
# fetched — but the exempt-list makes the install pass even when a fresh
# install reads the lockfile without honoring the link override.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - 'tods-competition-factory'
  - 'courthive-*'
  - '@courthive/*'
  - 'pdf-factory'
  - 'scoring-visualizations'
  - 'tabulator-scorecards'

# pnpm v11 runs a deps-status check before every `pnpm <script>` invocation.
# That fires the husky commit-msg hook (`pnpm run commitlint`) into pnpm,
# which then aborts the commit if the lockfile is briefly out of sync with
# the manifest — exactly the state a `git commit` of a dep bump produces
# between the staging step and the lockfile-sync step. Suppress it.
# (Same setting already in courthive-public/factory pnpm-workspace.yaml.)
verifyDepsBeforeRun: false

# pnpm v11 requires every transitive package with a lifecycle script
# to be explicitly approved (true) or denied (false) here. Packages
# left out trigger ERR_PNPM_IGNORED_BUILDS on fresh installs.
# `--frozen-lockfile` skips this gate, which is why the previous
# config (`allowBuilds:` with only positive entries, plus a
# non-recognized `ignoredBuiltDependencies:` array) appeared to work.
allowBuilds:
  esbuild: true             # downloads platform-specific binary
  electron-winstaller: true # Windows installer build
  core-js: false            # polyfills — funding banner only, skip
  cypress: false            # large browser binary; e2e via Playwright instead
  electron: false           # ~250MB binary; only needed for desktop mode

overrides:
  typescript: 6.0.3 # block native TS7 (no classic JS API — crashes tsc/nest/sonarjs); pairs with renovate TS-major block
  '@courthive/provider-config': link:../provider-config
  '@courthive/scoring-visualizations': link:../scoringVisualizations
  '@xmldom/xmldom': ^0.9.0
  # SCOPED EXCEPTION to the line above. The blanket ^0.9.0 override (a security
  # bump) also captures `plist`, which declares ^0.8.8 and calls
  # `new DOMParser().parseFromString(xml)` with NO mimeType — mandatory as of
  # xmldom 0.9. That makes `pnpm electron:package` die with
  # "the provided mimeType undefined is not valid" while parsing Electron's
  # Info.plist, i.e. the desktop app cannot be packaged at all.
  # plist reaches us ONLY through electron-builder: it is a build-time tool that
  # parses plists we generate ourselves, never shipped in the app bundle and
  # never fed untrusted input, so the 0.8 line is not an exposure here. Every
  # other consumer of xmldom stays on 0.9.
  'plist>@xmldom/xmldom': ^0.9.0
  'brace-expansion@1': ^5.0.0
  'brace-expansion@2': ^5.0.0
  'brace-expansion@>=4 <5.0.5': ^5.0.5
  courthive-components: link:../courthive-components
  dompurify: ^3.4.12 # GHSA (XSS); transitive via jspdf (^3.3.1). patched 3.4.12
  # A security FLOOR, not a range. It was '^4.0.0' for an earlier advisory and stopped being
  # a floor when four more landed INSIDE 4.x (host confusion x2, SSRF x2), all first patched
  # in 4.1.3 while the lockfile sat on 4.1.2. Pin the floor to the patched version.
  fast-uri: '^4.1.3'
  follow-redirects: ^1.16.0
  pdf-factory: link:../pdf-factory
  picomatch: ^4.0.4
  socket.io-parser: ^4.2.6
  tods-competition-factory: link:../factory
  undici: ^8.0.0
  ws: ^8.20.1
