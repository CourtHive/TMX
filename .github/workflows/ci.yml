name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # pnpm-workspace.yaml `link:` overrides win over package.json pins,
      # and the GitHub runner has no sibling clones at ../factory etc., so
      # any `link:` override would produce a dangling symlink. Lint
      # tolerates that today, but check-types / test / build would not —
      # strip the link: lines defensively so this stays green if those
      # steps are added later. Mirrors courthive-rankings 340ab59.
      - name: 'Strip link: overrides for CI'
        run: |
          node -e "
          const fs = require('fs');
          if (fs.existsSync('pnpm-workspace.yaml')) {
            const before = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
            const after = before.split('\n').filter(line => !/:\s*link:\S+\s*\$/.test(line)).join('\n');
            if (after !== before) fs.writeFileSync('pnpm-workspace.yaml', after);
          }
          "

      # The lockfile is KEPT and the install is --no-frozen-lockfile, rather than
      # `rm -f pnpm-lock.yaml`. Stripping the overrides makes the lockfile stale and
      # CI defaults to frozen, so something has to give — but deleting it re-resolves
      # EVERY dependency, which collides with `minimumReleaseAge: 1440` above the
      # moment any transitive dep published within the last 24h. That fails an
      # unrelated PR with ERR_PNPM_NO_MATURE_MATCHING_VERSION and nothing the author
      # can act on. It is not theoretical: it fired in competition-factory-server on
      # @storybook/csf-plugin@10.5.8, published 98 seconds inside the window.
      #
      # Keeping the lockfile re-resolves only the five stripped overrides — which are
      # exactly the packages minimumReleaseAgeExclude already exempts — and installs
      # everything else at its locked version, so CI is deterministic too.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint

      # Formatting gate. Nothing enforced prettier before this: the pre-commit
      # hook has `pnpm lint:staged` commented out on purpose (0ef81807), so 269
      # files had drifted by the time it was measured. The baseline was applied
      # in one formatting-only commit; this keeps it from drifting again, and
      # catches commits made with --no-verify too.
      #
      # `pnpm format` fixes anything this flags.
      - name: format:check
        run: pnpm format:check

      # Deterministic AST attribute-typo / schema-divergence gate. Fails only on
      # a PROP-class attribute name not in the triaged allow-list — i.e. a NEW
      # silent typo (matchUp.rondPosition, etc.). Baseline triaged 2026-07-05.
      - name: attr-audit
        run: pnpm attr-audit --ci
      # Hardcoded user-facing strings never become t() calls, so they reach no
      # locale file and no key-parity gate or completeness metric will ever
      # mention them — they are simply English forever. Ratchets against a
      # baseline of the ~620 that already exist: fails only on a NEW one.
      # Shrink the baseline by converting strings; never grow it to silence a
      # finding.
      - name: i18n-audit
        run: pnpm i18n-audit --ci

      # Type-checks src/ against the PUBLISHED factory, because the link:
      # overrides are stripped above. This is the only gate that can catch a
      # call into sibling work that exists locally but has not been published —
      # previously nothing did: `build + smoke` type-checks electron only, and
      # `pnpm build` (tsc + vite) runs solely in deploy-pages.yml, after merge.
      #
      # A TMX change that needs unreleased factory work will fail here, and that
      # is the point: it fails at the PR instead of at runtime in a deployed
      # client. The remedy is to publish the dependency, not to skip this.
      - name: check-types
        run: pnpm check-types

      # Local `pnpm test --run` used to be the only test evidence a reviewer
      # ever saw. The suite is a few seconds; there is no reason for CI not to
      # be the one running it.
      - name: test
        run: pnpm test --run
